name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: polyglot_im_test
          POSTGRES_USER: im_test
          POSTGRES_PASSWORD: local-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U im_test -d polyglot_im_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POLYGLOT_IM_TEST_POSTGRES_DSN: postgresql://im_test:local-ci-test-only@127.0.0.1:5432/polyglot_im_test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.40.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.32'
          python-version: '3.11'
      - run: uv sync --project python-sdk --locked
      - run: just check-versions check-docs lint-python test-python test-benchmark build-python
  scala:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.40.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: just lint-scala test-scala build-scala
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.40.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: cd dart-sdk && dart pub get --enforce-lockfile
      - run: cd flutter-sdk && flutter pub get --enforce-lockfile
      - run: cd examples/flutter_app && flutter pub get --enforce-lockfile
      - run: just lint-dart test-dart test-flutter build-dart build-flutter
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.40.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.32'
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: uv sync --project python-sdk --locked
      - run: cd dart-sdk && dart pub get --enforce-lockfile
      - run: just test-integration benchmark-smoke
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.40.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: cd examples/flutter_app && flutter pub get --enforce-lockfile
      - run: just build-ios
