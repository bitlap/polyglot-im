name: polyglot_im_flutter_sdk
description: polyglot-im Flutter 生命周期适配基础，面向跨平台消息 SDK 的 App 集成。
version: 0.1.0
publish_to: none
repository: https://github.com/bitlap/polyglot-im

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  sqflite: ^2.4.2
  flutter:
    sdk: flutter
  polyglot_im_dart_sdk:
    path: ../dart-sdk

dev_dependencies:
  http: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PolyglotImPlugin
