polyglot-im {
  server { host = "127.0.0.1", port = 8090, max-in-flight = 256 }
  database {
    password = ""
    pool-size = 8
    connection-timeout = 10 seconds
    statement-timeout = 15 seconds
    lock-timeout = 3 seconds
  }
  auth { issuer = "polyglot-im", user-jwt-secret = "" }
  apns { enabled = false, sandbox = false }
  push { parallelism = 8, lease-duration = 60 seconds, job-timeout = 20 seconds, poll-interval = 1 second }
  rate-limits { user-per-minute = 600, service-per-minute = 120 }
}
