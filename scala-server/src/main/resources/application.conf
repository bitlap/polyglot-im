# 可以在此直接填写部署配置；未指定 --config 时读取本文件。
# 默认值由 reference.conf 提供；敏感字段不提供内置密钥。
polyglot-im {
  database {
    url = ${?POLYGLOT_IM_DATABASE_URL}
    user = ${?POLYGLOT_IM_DATABASE_USER}
  }
  auth {
    app-id = ${?POLYGLOT_IM_APP_ID}
    user-jwt-secret = ${?POLYGLOT_IM_USER_JWT_SECRET}
    service-jwt-secret = ${?POLYGLOT_IM_SERVICE_JWT_SECRET}
    cursor-secret = ${?POLYGLOT_IM_CURSOR_SECRET}
  }
}
