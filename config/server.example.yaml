# 配置说明索引。程序实际读取环境变量，完整模板见 .env.example。
server:
  host_env: POLYGLOT_IM_HOST
  port_env: POLYGLOT_IM_PORT
storage:
  provider: postgresql
  database_url_env: POLYGLOT_IM_DATABASE_URL
  database_user_env: POLYGLOT_IM_DATABASE_USER
  database_password_env: POLYGLOT_IM_DATABASE_PASSWORD
  pool_size_env: POLYGLOT_IM_DATABASE_POOL_SIZE
  connection_timeout_ms_env: POLYGLOT_IM_DATABASE_CONNECTION_TIMEOUT_MS
auth:
  app_id_env: POLYGLOT_IM_APP_ID
  user_jwt_secret_env: POLYGLOT_IM_USER_JWT_SECRET
  service_jwt_secret_env: POLYGLOT_IM_SERVICE_JWT_SECRET
  introspection_url_env: POLYGLOT_IM_INTROSPECTION_URL
sync:
  cursor_secret_env: POLYGLOT_IM_CURSOR_SECRET
push:
  platform: ios
  provider: apns
  enabled_env: POLYGLOT_IM_APNS_ENABLED
