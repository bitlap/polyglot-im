# 复制为 *.local.conf 并填写独立随机密钥；该后缀已被 Git 忽略。
polyglot-im {
  server {
    host = "127.0.0.1"
    port = 8090
  }
  database {
    url = "jdbc:postgresql://127.0.0.1:5432/polyglot_im"
    user = "polyglot_im"
    password = "replace-locally"
    pool-size = 8
    connection-timeout = 10 seconds
  }
  auth {
    app-id = "your-app"
    issuer = "polyglot-im"
    # 三个不同随机密钥，各至少 32 字节；启动时拒绝以下占位符。
    user-jwt-secret = "replace-with-random-user-secret-at-least-32-bytes"
    service-jwt-secret = "replace-with-random-service-secret-at-least-32-bytes"
    cursor-secret = "replace-with-random-cursor-secret-at-least-32-bytes"
    # introspection-url = "https://auth.example.com/im/introspect"
  }
  apns {
    enabled = false
    sandbox = false
    # 开启时以下四项必填；key-file 相对当前配置文件目录解析。
    # team-id = "YOUR_TEAM_ID"
    # key-id = "YOUR_KEY_ID"
    # topic = "com.example.app"
    # key-file = "keys/AuthKey.p8"
  }
  rate-limits {
    user-per-minute = 600
    service-per-minute = 120
  }
}
