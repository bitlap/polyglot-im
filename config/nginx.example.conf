# 本地双实例示例；生产 TLS 在入口终止，替换 upstream 地址。
events { worker_connections 4096; }
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }
  upstream polyglot_im {
    least_conn;
    server 127.0.0.1:8090 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:8091 max_fails=2 fail_timeout=5s;
    keepalive 128;
  }
  server {
    listen 8080;
    client_max_body_size 64k;
    location / {
      proxy_pass http://polyglot_im;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 2s;
      proxy_read_timeout 75s;
      proxy_send_timeout 15s;
      proxy_buffering off;
      # 不启用 non_idempotent 自动重试；写入由 Client 携稳定幂等键重试。
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      # 默认不记录请求 URL，避免把 WS ticket 写入日志。
      access_log off;
    }
  }
}
