[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "polyglot-im-python-client"
version = "0.1.0"
description = "polyglot-im 跨平台消息协议与 Python Client 基础"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "bitlap contributors"}]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4"]
http = ["httpx>=0.27,<1", "websockets>=14,<16"]

[project.urls]
Repository = "https://github.com/bitlap/polyglot-im"

[dependency-groups]
dev = ["psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4", "websockets>=14,<16", "httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.11,<1", "jsonschema>=4.23,<5", "PyYAML>=6,<7", "openapi-spec-validator>=0.7,<0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/polyglot_im"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"
"../NOTICE" = "NOTICE"
